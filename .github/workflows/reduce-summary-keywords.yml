name: Reduce summary keywords

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reduce-summary-keywords.yml"

permissions:
  contents: write

jobs:
  reduce-and-build:
    if: contains(github.event.head_commit.message, '요약 키워드 축소 실행')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reduce summary keywords
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("summary-app/page.tsx")
          page = page_path.read_text(encoding="utf-8")

          replacements = {
              '''      keywords: [
                "루트 노드",
                "질문 노드",
                "부모 노드",
                "자식 노드",
                "엣지",
                "리프 노드",
                "깊이",
                "높이",
              ],''': '''      keywords: ["루트 노드", "질문 노드", "리프 노드"],''',
              '''      keywords: [
                "엔트로피",
                "실제값의 섞임",
                "불확실성",
                "순수 노드",
                "가중평균 엔트로피",
                "정보이득",
                "좋은 분할",
              ],''': '''      keywords: ["엔트로피", "가중평균 엔트로피", "정보이득"],''',
              '''      keywords: [
                "후보 속성",
                "정보이득 계산",
                "최댓값 선택",
                "데이터 분할",
                "반복 분할",
                "리프 노드 확정",
              ],''': '''      keywords: ["정보이득 계산", "최댓값 선택", "반복 분할"],''',
          }

          for old, new in replacements.items():
              if old not in page:
                  raise SystemExit(f"Keyword block not found: {old[:40]}")
              page = page.replace(old, new, 1)

          page_path.write_text(page, encoding="utf-8")

          css_path = Path("summary-app/formula-summary.css")
          css = css_path.read_text(encoding="utf-8")
          css = css.replace("  min-height: 390px;", "  min-height: 300px;", 1)
          css = css.replace(
              '''  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 12px 10px;''',
              '''  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;''',
              1,
          )
          css = css.replace("  min-height: 50px;", "  min-height: 62px;", 1)
          css = css.replace("  display: inline-flex;", "  display: flex;", 1)
          css = css.replace("  font-size: 21px;", "  font-size: 23px;", 1)
          css = css.replace("    min-height: 44px;", "    min-height: 52px;", 1)
          css = css.replace("    font-size: 18px;", "    font-size: 19px;", 1)
          css = css.replace("    min-height: 42px;", "    min-height: 50px;", 1)
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Copy build output
        run: cp -R github-pages-dist/. .

      - name: Commit source and generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary-app/page.tsx summary-app/formula-summary.css index.html scatter summary purchase-tree assets
          git commit -m "요약 키워드를 항목별 세 개로 축소"
          git push

# trigger
