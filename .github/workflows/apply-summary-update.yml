name: Apply summary formula update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-summary-update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply requested summary changes
        run: python .github/apply-summary-update.py

      - name: Remove one-time update files
        run: rm .github/apply-summary-update.py .github/workflows/apply-summary-update.yml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary-app/page.tsx summary-app/formula-summary.css static-site/summary/main.tsx static-site/summary/index.html .github
          git commit -m "요약 공식 정리 및 6번 문항 제거"
          git push
