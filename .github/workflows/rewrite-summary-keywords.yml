name: Rewrite summary as keywords

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rewrite-summary-keywords.yml"

permissions:
  contents: write

jobs:
  rewrite-and-build:
    if: contains(github.event.head_commit.message, '요약 키워드 화면 수정 실행')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rewrite summary screen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path("summary-app/page.tsx")
          page = page_path.read_text(encoding="utf-8")

          replacement = '''function Summary({ start }: { start: () => void }) {
            const keywordGroups = [
              {
                number: "01",
                tone: "structure",
                title: "트리의 구조",
                keywords: [
                  "루트 노드",
                  "질문 노드",
                  "부모 노드",
                  "자식 노드",
                  "엣지",
                  "리프 노드",
                  "깊이",
                  "높이",
                ],
              },
              {
                number: "02",
                tone: "split",
                title: "분할 기준",
                keywords: [
                  "엔트로피",
                  "실제값의 섞임",
                  "불확실성",
                  "순수 노드",
                  "가중평균 엔트로피",
                  "정보이득",
                  "좋은 분할",
                ],
              },
              {
                number: "03",
                tone: "id3",
                title: "ID3 알고리즘",
                keywords: [
                  "후보 속성",
                  "정보이득 계산",
                  "최댓값 선택",
                  "데이터 분할",
                  "반복 분할",
                  "리프 노드 확정",
                ],
              },
            ];

            return (
              <section className="summary-page keyword-summary-page">
                <div className="summary-title">
                  <span>의사결정 트리 핵심 키워드</span>
                </div>

                <div className="keyword-summary-grid">
                  {keywordGroups.map((group) => (
                    <article
                      className={`keyword-card tone-${group.tone}`}
                      key={group.title}
                    >
                      <div className="keyword-card-title">
                        <span>{group.number}</span>
                        <h2>{group.title}</h2>
                      </div>
                      <ul>
                        {group.keywords.map((keyword) => (
                          <li key={keyword}>{keyword}</li>
                        ))}
                      </ul>
                    </article>
                  ))}
                </div>

                <div className="summary-action">
                  <button onClick={start}>확인 퀴즈 풀기 →</button>
                </div>
              </section>
            );
          }

          function CadetSetup'''

          pattern = re.compile(
              r'function Summary\(\{ start \}: \{ start: \(\) => void \}\) \{.*?\n\}\n\nfunction CadetSetup',
              re.S,
          )
          page, count = pattern.subn(replacement, page, count=1)
          if count != 1:
              raise SystemExit(f"Summary replacement failed: {count}")
          page_path.write_text(page, encoding="utf-8")

          css = r'''
          .keyword-summary-page {
            padding-bottom: 32px;
          }

          .keyword-summary-grid {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
          }

          .keyword-card {
            min-width: 0;
            min-height: 390px;
            padding: 0 24px 28px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-top: 6px solid var(--blue);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 7px 22px #142c4f12;
          }

          .keyword-card.tone-split {
            border-top-color: #566f9f;
          }

          .keyword-card.tone-id3 {
            border-top-color: var(--orange);
          }

          .keyword-card-title {
            min-height: 92px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-bottom: 1px solid #e3eaf1;
          }

          .keyword-card-title > span {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: grid;
            place-items: center;
            color: #fff;
            background: var(--blue);
            border-radius: 50%;
            font-size: 14px;
            font-weight: 950;
          }

          .tone-split .keyword-card-title > span {
            background: #566f9f;
          }

          .tone-id3 .keyword-card-title > span {
            background: var(--orange);
          }

          .keyword-card-title h2 {
            margin: 0;
            color: var(--ink);
            font-size: clamp(27px, 2.1vw, 34px);
            letter-spacing: -0.04em;
          }

          .keyword-card ul {
            margin: 26px 0 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 12px 10px;
            list-style: none;
          }

          .keyword-card li {
            min-height: 50px;
            padding: 0 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #b9d5e9;
            border-radius: 10px;
            color: #1f5f91;
            background: #f1f8fd;
            font-size: 21px;
            font-weight: 900;
            line-height: 1.25;
            word-break: keep-all;
          }

          .tone-split li {
            border-color: #bdcbe0;
            color: #405b88;
            background: #f3f6fa;
          }

          .tone-id3 li {
            border-color: #f0c4ad;
            color: #a14931;
            background: #fff5f0;
          }

          .keyword-summary-page .summary-action {
            margin-top: 18px;
          }

          @media (max-width: 1050px) {
            .keyword-summary-grid {
              grid-template-columns: 1fr;
            }

            .keyword-card {
              min-height: 0;
              padding-bottom: 24px;
            }
          }

          @media (max-width: 680px) {
            .keyword-summary-page {
              width: calc(100% - 24px);
              margin-top: 12px;
            }

            .keyword-summary-grid {
              gap: 12px;
            }

            .keyword-card {
              padding: 0 16px 20px;
              border-radius: 13px;
            }

            .keyword-card-title {
              min-height: 72px;
              gap: 10px;
            }

            .keyword-card-title > span {
              width: 34px;
              height: 34px;
              flex-basis: 34px;
              font-size: 12px;
            }

            .keyword-card-title h2 {
              font-size: 24px;
            }

            .keyword-card ul {
              margin-top: 18px;
              gap: 9px 7px;
            }

            .keyword-card li {
              min-height: 44px;
              padding: 0 13px;
              font-size: 18px;
            }
          }

          @media (max-width: 420px) {
            .keyword-card li {
              min-height: 42px;
              font-size: 17px;
            }
          }
          '''
          Path("summary-app/formula-summary.css").write_text(css.strip() + "\n", encoding="utf-8")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Copy build output
        run: cp -R github-pages-dist/. .

      - name: Commit source and generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary-app/page.tsx summary-app/formula-summary.css index.html scatter summary purchase-tree assets
          git commit -m "요약 화면을 핵심 키워드로 단순화"
          git push
