<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>질문과 분할로 만드는 의사결정 트리</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f4f7fa;color:#16243a}header{background:#173b67;color:#fff;padding:18px 28px}header small{opacity:.75}header h1{margin:5px 0 0;font-size:25px}main{max-width:1400px;margin:22px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:end}.top h2{font-size:34px;margin:0 0 5px}.top p{margin:0;color:#66758a}.badges span{display:inline-block;padding:9px 13px;border-radius:20px;font-weight:800}.yes{background:#e5f3fb;color:#21699b}.no{background:#fff0eb;color:#a74632}.grid{display:grid;grid-template-columns:1.55fr .75fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dbe4ed;border-radius:15px;box-shadow:0 8px 22px #173b6712}.lab{padding:17px}.toolbar{display:flex;justify-content:space-between;align-items:center}.tabs button,.actions button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.tabs button{background:#edf2f6;color:#52677e}.tabs button.on{background:#2878b8;color:#fff}.question{background:#fff0eb;padding:10px 14px;border-radius:10px;font-weight:800}.plot{margin-top:12px;border:1px solid #dbe4ed;border-radius:12px;background:#fbfcfd;padding:8px}.plot svg{width:100%;display:block;touch-action:none}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.metric,.group{border:1px solid #dbe4ed;border-radius:10px;padding:11px;background:#fafbfd}.metric span{display:block;color:#6a788b;font-size:13px;font-weight:700}.metric b{font-size:24px}.groups{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.group h3{margin:0 0 7px}.bar{height:12px;border-radius:20px;overflow:hidden;background:#edf1f4;display:flex}.bar i:first-child{background:#2878b8}.bar i:last-child{background:#e65c3f}.group p{display:flex;justify-content:space-between;margin:7px 0 0;color:#637286;font-size:13px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:#f0f4f7;border-radius:10px;padding:11px}.actions button{background:#e65c3f;color:white}.treewrap{padding:17px}.treewrap h2{text-align:center}.tree{min-height:570px;border:1px solid #dbe4ed;border-radius:12px;padding:28px 12px;background:#f9fbfc;display:flex;flex-direction:column;align-items:center}.node{width:210px;padding:14px;border:3px solid #e65c3f;border-radius:12px;background:#fff;text-align:center;font-weight:800}.branches{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:54px;position:relative}.branches:before{content:'';position:absolute;left:25%;right:25%;top:-28px;border-top:2px solid #aebac7}.branches:after{content:'';position:absolute;left:50%;top:-54px;height:26px;border-left:2px solid #aebac7}.branch{text-align:center;position:relative}.branch:before{content:'';position:absolute;left:50%;top:-28px;height:28px;border-left:2px solid #aebac7}.leaf{margin-top:14px;padding:12px;border:2px solid #8ab7d5;border-radius:9px;background:#eaf5fc;font-weight:800}.axis{font-size:14px;font-weight:800;fill:#405872}.tick{font-size:12px;fill:#718093}.gridline{stroke:#e2e8ef}.split{stroke:#e65c3f;stroke-width:5;stroke-dasharray:10 7}.pt circle{stroke-width:2.5}.pt.yes circle{fill:#e5f4fc;stroke:#2878b8}.pt.no circle{fill:#ffebe5;stroke:#e65c3f}.pt text{font-size:10px;text-anchor:middle;font-weight:900}.pt.yes text{fill:#21699b}.pt.no text{fill:#a74632}@media(max-width:1000px){body{min-width:1000px}}</style></head><body><header><small>인공지능 개론 · 의사결정 나무 실습</small><h1>질문과 분할로 만드는 의사결정 트리</h1></header><main><div class="top"><div><h2>분할선을 움직여 보세요</h2><p>분할 기준이 바뀌면 엔트로피와 정보이득도 함께 변합니다.</p></div><div class="badges"><span class="yes">구매 9명</span><span class="no">미구매 5명</span></div></div><div class="grid"><section class="card lab"><div class="toolbar"><div class="tabs"><button id="bx" class="on" onclick="setAxis('x')">나이</button><button id="by" onclick="setAxis('y')">소득</button></div><div id="q" class="question"></div></div><div class="plot"><svg id="svg" viewBox="0 0 860 520"></svg></div><div class="metrics"><div class="metric"><span>분할 전 엔트로피</span><b id="ph"></b></div><div class="metric"><span>분할 후 가중평균 엔트로피</span><b id="wh"></b></div><div class="metric"><span>정보이득</span><b id="ig"></b></div></div><div class="groups"><div id="g1" class="group"></div><div id="g2" class="group"></div></div><div class="actions"><span>정보이득이 클수록 두 집단이 더 명확하게 나뉩니다.</span><button onclick="confirmSplit()">이 질문으로 분할</button></div></section><aside class="card treewrap"><h2>현재 의사결정 트리</h2><div id="tree" class="tree"><div class="node">질문을 선택하면<br>트리가 만들어집니다.</div></div></aside></div></main><script>const D=[[1,3,0],[1,3,0],[2,3,1],[3,2,1],[3,1,1],[3,1,0],[2,1,1],[1,2,0],[1,1,1],[3,2,1],[1,2,1],[2,2,1],[2,3,1],[3,2,0]].map((d,i)=>({id:String(i+1).padStart(2,'0'),x:d[0],y:d[1],label:d[2]}));let axis='x',t=1;const P={l:80,r:805,t:35,b:455};const X=v=>P.l+(v-.5)/3*(P.r-P.l),Y=v=>P.b-(v-.5)/3*(P.b-P.t);function H(a){if(!a.length)return 0;let p=a.filter(d=>d.label).length/a.length,q=1-p;return(p?-p*Math.log2(p):0)+(q?-q*Math.log2(q):0)}function split(){return{a:D.filter(d=>d[axis]<=t),b:D.filter(d=>d[axis]>t)}}function setAxis(a){axis=a;t=1;bx.classList.toggle('on',a==='x');by.classList.toggle('on',a==='y');render()}function box(name,a){let y=a.filter(d=>d.label).length,n=a.length-y,z=a.length||1;return`<h3>${name} · ${a.length}명</h3><div class="bar"><i style="width:${y/z*100}%"></i><i style="width:${n/z*100}%"></i></div><p><span>구매 ${y}</span><span>미구매 ${n}</span><span>H=${H(a).toFixed(3)}</span></p>`}function render(){let s=split(),parent=H(D),weighted=s.a.length/D.length*H(s.a)+s.b.length/D.length*H(s.b);q.textContent=axis==='x'?(t===1?'나이가 청소년인가?':'나이가 청년 이하인가?'):(t===1?'소득이 낮은가?':'소득이 중간 이하인가?');ph.textContent=parent.toFixed(3);wh.textContent=weighted.toFixed(3);ig.textContent=(parent-weighted).toFixed(3);g1.innerHTML=box('예 · 이하',s.a);g2.innerHTML=box('아니오 · 초과',s.b);let z='';for(let i=1;i<=3;i++){z+=`<line class="gridline" x1="${X(i)}" x2="${X(i)}" y1="${P.t}" y2="${P.b}"/><text class="tick" x="${X(i)}" y="${P.b+24}" text-anchor="middle">${i}</text><line class="gridline" x1="${P.l}" x2="${P.r}" y1="${Y(i)}" y2="${Y(i)}"/><text class="tick" x="${P.l-25}" y="${Y(i)+4}" text-anchor="middle">${i}</text>`}D.forEach(p=>z+=`<g class="pt ${p.label?'yes':'no'}" transform="translate(${X(p.x)} ${Y(p.y)})"><circle r="18"/><text y="4">${p.id}</text></g>`);let pos=axis==='x'?(X(t)+X(t+1))/2:(Y(t)+Y(t+1))/2;z+=axis==='x'?`<line class="split" x1="${pos}" x2="${pos}" y1="${P.t}" y2="${P.b}"/>`:`<line class="split" x1="${P.l}" x2="${P.r}" y1="${pos}" y2="${pos}"/>`;z+=`<text class="axis" x="${(P.l+P.r)/2}" y="505" text-anchor="middle">나이 수준 (1 청소년 · 2 청년 · 3 중년)</text><text class="axis" transform="translate(22 ${(P.t+P.b)/2}) rotate(-90)" text-anchor="middle">소득 수준 (1 낮음 · 2 중간 · 3 높음)</text>`;svg.innerHTML=z}svg.addEventListener('click',e=>{let r=svg.getBoundingClientRect(),sx=860/r.width,sy=520/r.height,mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;if(axis==='x')t=mx<(X(2)+X(3))/2?1:2;else t=my>(Y(2)+Y(3))/2?1:2;render()});function confirmSplit(){let s=split(),left=s.a.every(d=>d.label)||s.a.every(d=>!d.label),right=s.b.every(d=>d.label)||s.b.every(d=>!d.label);tree.innerHTML=`<div class="node">${q.textContent}</div><div class="branches"><div class="branch"><b>예</b><div class="leaf">${left?(s.a[0]?.label?'구매':'미구매'):`구매 ${s.a.filter(d=>d.label).length} / 미구매 ${s.a.filter(d=>!d.label).length}`}</div></div><div class="branch"><b>아니오</b><div class="leaf">${right?(s.b[0]?.label?'구매':'미구매'):`구매 ${s.b.filter(d=>d.label).length} / 미구매 ${s.b.filter(d=>!d.label).length}`}</div></div></div>`}render();</script></body></html>
