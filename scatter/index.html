g:8px 12px;color:#8e4435;font-weight:850;font-size:13px}.metrics{margin-top:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:12px;border:1px solid var(--l);border-radius:10px;background:#fafbfd}.metric small{display:block;color:var(--m);font-weight:800}.metric strong{display:block;margin-top:4px;font-size:20px}.metric.good strong{color:var(--g)}.results{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.result{padding:12px;border:1px solid var(--l);border-radius:10px;background:#fafbfd}.result-head{display:flex;justify-content:space-between}.bar{height:12px;margin:9px 0;display:flex;overflow:hidden;border-radius:99px;background:#e8edf2}.bar i:first-child{background:var(--b)}.bar i:last-child{background:var(--o)}.counts{display:flex;gap:10px;font-size:13px}.counts em{margin-left:auto;font-style:normal;font-weight:850}.actions{margin-top:11px;padding:12px 13px;background:#f1f5f8;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:14px}.actions p{margin:0;color:#4c6078;font-weight:750}.actions button{min-height:42px;padding:0 17px;border:0;border-radius:9px;background:var(--o);color:#fff;font-weight:900;cursor:pointer}.actions .secondary{background:#fff;color:#415b77;border:1px solid #cbd6e2}.tree-card{position:sticky;top:12px;padding:18px;text-align:center}.tree-card>span{color:var(--o);font-size:12px;font-weight:950;letter-spacing:.1em}.tree-card h2{margin:5px 0 14px}.tree{min-height:520px;padding:25px 10px;border:1px solid #e2e8ef;border-radius:12px;background-color:#f8fafc;background-image:radial-gradient(#d4dde8 .8px,transparent .8px);background-size:16px 16px;display:flex;flex-direction:column;align-items:center}.node{width:205px;min-height:88px;padding:11px;border:2px solid #b8c6d4;border-radius:11px;background:#fff;box-shadow:0 6px 13px #1c365515;display:flex;flex-direction:column;justify-content:center;gap:5px;z-index:2}.node.current{border:3px solid var(--o);box-shadow:0 0 0 5px #e7 lass="question"><small>현재 질문</small><strong id="questionText"></strong></div></div><div class="plot-wrap"><svg id="plot" viewBox="0 0 900 570"></svg><div class="tip">↔ 그래프를 클릭하거나 분할선을 끌어 이동합니다</div></div><div class="metrics"><div class="metric"><small>분할 전 엔트로피</small><strong id="parentEntropy"></strong></div><div class="metric"><small>분할 후 가중평균 엔트로피</small><strong id="weightedEntropy"></strong></div><div class="metric good"><small>정보이득</small><strong id="gain"></strong></div></div><div class="results"><article class="result" id="lowResult"></article><article class="result" id="highResult"></article></div><div class="actions"><p id="guideText"></p><button id="confirmBtn"></button></div></div><aside class="card tree-card"><span>질문이 쌓이는 모습</span><h2>현재 의사결정 트리</h2><div class="tree" id="tree"></div></aside></section></main><footer>※ 강의에서 사용한 컴퓨터 구매 예제를 바탕으로 재구성한 교육용 데이터입니다.</footer><script>const P=[{id:'01',x:2,y:3,l:'no'},{id:'02',x:2,y:5,l:'no'},{id:'03',x:3,y:4,l:'buy'},{id:'04',x:3,y:6,l:'buy'},{id:'05',x:4,y:3,l:'no'},{id:'06',x:4,y:5,l:'buy'},{id:'07',x:5,y:2,l:'buy'},{id:'08',x:5,y:4,l:'buy'},{id:'09',x:6,y:3,l:'buy'},{id:'10',x:6,y:6,l:'no'},{id:'11',x:7,y:2,l:'buy'},{id:'12',x:7,y:5,l:'no'},{id:'13',x:8,y:4,l:'buy'},{id:'14',x:8,y:6,l:'buy'}],M={x:['나이 수준','단계'],y:['소득 수준','단계']};let S=1,A='x',T=4,L=null,T2=4,D=false;const R={l:82,r:822,t:36,b:480},W=R.r-R.l,H=R.b-R.t,X=v=>R.l+(v-1)/7*W,Y=v=>R.b-(v-1)/5*H,C=a=>({buy:a.filter(p=>p.l==='buy').length,no:a.filter(p=>p.l==='no').length}),E=a=>{if(!a.length)return 0;let c=C(a);return[c.buy,c.no].reduce((s,n)=>{if(!n)return s;let p=n/a.length;return s-p*Math.log2(p)},0)},SP=(a,k,t)=>({lo:a.filter(p=>p[k]<=t),hi:a.filter(p=>p[k]>t)}),WE=(a,k,t)=>{let g=SP(a,k,t);return g.lo.length/a.length*E(g.lo)+g.hi.length/a.length*E(g.hi)},Q=(k,t)=>`${M[k][0]}이 ${t}${M[k][1]} 이하입니까?`,AP=()=>{if(!L)return P;let g=SP(P,L.a,L.t);return L.s==='lo'?g.lo:g.hi},AA=()=>S===1?A:(L.a==='x'?'y':'x'),AT=()=>S===1?T:T2,IP=p=>{if(!L)return true;let lo=p[L.a]<=L.t;return L.s==='lo'?lo:!lo};function RH(n,a){let c=C(a),t=a.length||1;return`<div class="result-head"><span>${n}</span><strong>${a.length}명</strong></div><div class="bar"><i style="width:${c.buy/t*100}%"></i><i style="width:${c.no/t*100}%"></i></div><div class="counts"><b class="buy">구매 ${c.buy}</b><b class="no">미구매 ${c.no}</b><em>H = ${E(a).toFixed(3)}</em></div>`}function PR(){let z=['데이터 확인','1차 질문 탐색','1차 분할 확정','2차 질문 탐색','트리 완성'],r=S===1?1:S===2?3:4;progress.innerHTML=z.map((x,i)=>`<div class="step ${i<=r?'active':''}"><b>${i+1}</b><span>${x}</span></div>`).join('')}function TR(){let h='';if(!L)h='<div class="node current"><small>질문 1</small><strong>왼쪽 그래프에서 첫 질문을 탐색하세요</strong></div>';else{let a=L.a==='x'?'y':'x';h=`<div class="node locked"><small>질문 1</small><strong>${Q(L.a,L.t)}</strong></div><div class="branches"><div class="branch"><b>예</b>${L.s==='lo'?`<div class="node child ${S===3?'locked':'current'}"><small>질문 2</small><strong>${Q(a,T2)}</strong></div>`:'<div class="leaf">분류 결과</div>'}</div><div class="branch"><b>아니오</b>${L.s==='hi'?`<div class="node child ${S===3?'locked':'current'}"><small>질문 2</small><strong>${Q(a,T2)}</strong></div>`:'<div class="leaf">분류 결과</div>'}</div></div>${S===3?'<div class="complete">분할선 두 개가 질문 두 개가 되어 트리를 구성했습니다.</div>':''}`}tree.innerHTML=h}function DR(){let a=AA(),t=AT(),p=AP(),s=`<rect class="plot" x="${R.l}" y="${R.t}" width="${W}" height="${H}"/>`;for(let i=1;i<=8;i++)s+=`<line class="grid" x1="${X(i)}" x2="${X(i)}" y1="${R.t}" y2="${R.b}"/><text class="tick" x="${X(i)}" y="${R.b+24}">${i}</text>`;for(let i=1;i<=6;i++)s+=`<line class="grid" x1="${R.l}" x2="${R.r}" y1="${Y(i)}" y2="${Y(i)}"/><text class="tick" x="${R.l-25}" y="${Y(i)+5}">${i}</text>`;if(L){let z=L.a==='x'?(X(L.t)+X(L.t+1))/2:(Y(L.t)+Y(L.t+1))/2;s+=L.a==='x'?`<line class="locked" x1="${z}" x2="${z}" y1="${R.t}" y2="${R.b}"/>`:`<line class="locked" x1="${R.l}" x2="${R.r}" y1="${z}" y2="${z}"/>`}P.forEach(p=>s+=`<g class="point ${p.l} ${S>=2&&!IP(p)?'dim':''}" transform="translate(${X(p.x)} ${Y(p.y)})"><circle r="19"/><text y="4">${p.id}</text></g>`);let z=a==='x'?(X(t)+X(t+1))/2:(Y(t)+Y(t+1))/2;s+=a==='x'?`<line class="split-line" x1="${z}" x2="${z}" y1="${R.t}" y2="${R.b}"/><circle class="split-handle" cx="${z}" cy="${R.t+27}" r="18"/><text class="split-text" x="${z}" y="${R.t+32}">${t}</text>`:`<line class="split-line" x1="${R.l}" x2="${R.r}" y1="${z}" y2="${z}"/><circle class="split-handle" cx="${R.l+31}" cy="${z}" r="18"/><text class="split-text" x="${R.l+31}" y="${z+5}">${t}</text>`;s+=`<text class="axis-label" x="${(R.l+R.r)/2}" y="548">나이 수준 (X)</text><text class="axis-label" transform="translate(25 ${(R.t+R.b)/2}) rotate(-90)">소득 수준 (Y)</text>`;plot.innerHTML=s;let g=SP(p,a,t);lowResult.innerHTML=RH('예 · 이하 집단',g.lo);highResult.innerHTML=RH('아니오 · 초과 집단',g.hi);parentEntropy.textContent=E(p).toFixed(3);weightedEntropy.textContent=WE(p,a,t).toFixed(3);gain.textContent=(E(p)-WE(p,a,t)).toFixed(3);questionText.textContent=Q(a,t)}function RD(){PR();DR();TR();document.querySelectorAll('#axisButtons button').forEach(b=>b.classList.toggle('active',b.dataset.axis===A));axisButtons.style.display=S===1?'flex':'none';toolbarLabel.textContent=S===1?'첫 번째 질문의 속성':'두 번째 질문의 속성';heroTitle.textContent=S===1?'분할선을 움직여 가장 좋은 첫 질문을 찾아보세요':S===2?'아직 섞여 있는 집단을 한 번 더 분할해 보세요':'두 번의 질문으로 의사결정 트리를 완성했습니다';guideText.textContent=S===1?'정보이득이 커지는 위치를 찾아 첫 질문을 확정하세요.':S===2?'강조된 하위 데이터만 대상으로 두 번째 질문을 선택하세요.':'분할선 하나가 질문 하나가 되고, 반복하면 트리가 성장합니다.';confirmBtn.textContent=S===1?'이 위치로 1차 분할 →':S===2?'2차 분할 확정 →':'다시 체험하기';confirmBtn.className=S===3?'secondary':''}function V(e){let r=e.currentTarget.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*900,sy=(e.clientY-r.top)/r.height*570,a=AA(),v=a==='x'?1+(sx-R.l)/W*7:1+(R.b-sy)/H*5;return Math.max(1,Math.min(a==='x'?7:5,Math.floor(v)))}plot.addEventListener('pointerdown',e=>{if(S===3)return;D=true;plot.setPointerCapture(e.pointerId);let v=V(e);S===1?T=v:T2=v;RD()});plot.addEventListener('pointermove',e=>{if(!D||S===3)return;let v=V(e);S===1?T=v:T2=v;RD()});plot.addEventListener('pointerup',()=>D=false);document.querySelectorAll('#axisButtons button').forEach(b=>b.onclick=()=>{A=b.dataset.axis;T=A==='x'?4:3;RD()});confirmBtn.onclick=()=>{if(S===1){let g=SP(P,A,T);L={a:A,t:T,s:E(g.lo)>=E(g.hi)?'lo':'hi'};T2=L.a==='x'?3:4;S=2}else if(S===2)S=3;else RS();RD()};function RS(){S=1;A='x';T=4;L=null;T2=4;D=false}resetBtn.onclick=()=>{RS();RD()};RD();</script></body></html>
